name: Trivy scheduled Docker image scan for external dependencies

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  # Label of the issues created for vulnerable images, see the report job.
  ISSUE_LABEL: vulnerability
  # GitHub user the new issues are assigned to; empty for none.
  ISSUE_ASSIGNEE: ''

jobs:

  collect-docker-images:
    runs-on: ubuntu-latest
    env:
      OUTPUT_FILE: workflows/docker-images-matrix.json
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.9.0

      - id: set-matrix
        name: Generate image matrix of current master branch
        env:
          # Any image that matches any of these patterns will be ignored for scanning.
          # Reasons:
          # - bats: init container
          # - busybox: init container
          # - alpine: init container
          # - linuxserver/yq: init container
          EXCLUDE_IMAGE_PATTERNS:  bats
            busybox
            docker.io/alpine
            linuxserver/yq
          # In this action we only scan 'external' dependencies of the RADAR-base deployment.
          # RADAR-base services are scanned in the respective GitHub repositories.
          # Notes on charts:
          # - velero: we do not offer this chart as part of the official release and therefore do not check for vulnerabilities.
          INCLUDE_CHARTS: charts/cc-schema-registry-proxy
            charts/cert-manager-lets-encrypt
            charts/kube-prometheus-stack
            charts/radar-grafana
            charts/radar-hydra
            charts/radar-kratos
            charts/radar-s3-proxy
            charts/radar-nifi
            charts/radar-redis
            external/cloudnativepg-operator
            external/elasticsearch
            external/fluent-bit
            external/kubecost
            external/graylog
            external/headlamp
            external/ingress-nginx
            external/nginx-gateway-fabric
            external/strimzi-kafka-operator
            external/strimzi-registry-operator
            external/redis-operator
          # Any image that matches any of these patterns will be included for scanning.
          # Reasons:
          # - ghcr.io/cloudnative-pg/postgresql:16: deployed via operator so image tag not specifies in the chart in this repo.
          # - timescale/timescaledb-ha:pg16-ts2.15: deployed via operator so image tag not specified in the chart in this repo.
          # - quay.io/strimzi/kafka:0.46.0-kafka-3.9.0: deployed via operator so image tag not specified in the chart in this repo.
          # - confluentinc/cp-schema-registry:7.2.1: deployed via operator so image tag not specified in the chart in this repo.
          # - docker.io/bitnamilegacy/minio:2024.8.3-debian-12-r0: overridden in RADAR-Kubernetes. Will be replaced by non-bitnami chart soon.
          # - docker.io/bitnamilegacy/mongodb:7.0.12-debian-12-r4: overridden in RADAR-Kubernetes. Will be replaced by non-bitnami chart soon.
          INCLUDE_IMAGES: ghcr.io/cloudnative-pg/postgresql:16
            timescale/timescaledb-ha:pg16-ts2.15
            quay.io/strimzi/kafka:0.46.0-kafka-3.9.0
            confluentinc/cp-schema-registry:7.2.1
            docker.io/bitnamilegacy/minio:2024.8.3-debian-12-r0
            docker.io/bitnamilegacy/mongodb:7.0.12-debian-12-r4
        run: .github/bin/external_docker_image_matrix

      # Disabled for now because it conflicts with the protection rule on main branch.
      # - name: Commit and push if docker-images-matrix.json changed
      #   run: |
      #     git diff
      #     git config --global user.email "actions@github.com"
      #     git config --global user.name "GitHub Action"
      #     git add .github/workflows/docker-images-matrix.json
      #     git commit -am "Update docker image references in docker-images-matrix.json" || exit 0
      #     git push

  scan:
    needs: collect-docker-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.collect-docker-images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .trivyignore.yaml
          sparse-checkout-cone-mode: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      # Writes the report format of thehyve/vulnerability-scanning's create-issue action.
      - name: Run Trivy to check for vulnerabilities
        env:
          DOCKER_IMAGE: ${{ matrix.DOCKER_IMAGE }}
        run: |
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore.yaml --format json --output trivy.json "$DOCKER_IMAGE"
          jq --arg id "$DOCKER_IMAGE" '[{
            ArtifactID: $id,
            vulnerabilities: [.Results[]? | .Vulnerabilities[]? | {Title, VulnerabilityID, Severity}] | unique
          }]' trivy.json > result.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-${{ strategy.job-index }}
          path: result.json

  report:
    needs: [collect-docker-images, scan]
    # Also report when some images failed to scan.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scan-*
          path: results

      - name: Merge scan results
        run: jq -s 'add' results/*/result.json > scan_result.json

      # Detected vulnerabilities will appear on GitHub as one issue per image.
      - name: Report new vulnerabilities
        uses: thehyve/vulnerability-scanning/.github/actions/create-issue@b187734700d0ac484d8f17ed3450cc846c723d71 # main 2026-05-28
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.ISSUE_LABEL }}
          assignee: ${{ env.ISSUE_ASSIGNEE }}
          file-name: scan_result.json

      # create-issue never closes issues. Close the ones for images that are no longer deployed, or that were
      # scanned in this run and came out clean. Images whose scan failed keep their issue.
      - name: Close resolved issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX: ${{ needs.collect-docker-images.outputs.matrix }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$ISSUE_LABEL" --limit 500 \
              --json number,title \
            | jq -r --argjson matrix "$MATRIX" --slurpfile results scan_result.json '
                ($matrix.include | map(.DOCKER_IMAGE)) as $listed
                | ($results[0] | map(.ArtifactID)) as $scanned
                | ($results[0] | map(select(.vulnerabilities | length > 0) | .ArtifactID)) as $vulnerable
                | .[]
                | (.title | sub("^Vulnerability detected in "; "")) as $image
                | select(($listed | index($image) | not)
                    or (($scanned | index($image)) and ($vulnerable | index($image) | not)))
                | .number' \
            | xargs -r -I{} gh issue close --repo "$GITHUB_REPOSITORY" {} \
                --comment "Resolved: the image has no fixable HIGH/CRITICAL vulnerabilities left, or the charts no longer deploy it."
