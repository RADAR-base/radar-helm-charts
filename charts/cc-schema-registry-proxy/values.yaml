# -- Number of cc-schema-registry-proxy replicas to deploy
replicaCount: 1

service:
  # -- Kubernetes Service type,
  type: ExternalName
  # -- Domain name used for pointing to actual schema registry instance
  externalName: schema-registry-domain
  # -- Port number to connect to Confluent platform
  port: 443

# -- Reconfigure Ingress to not force TLS
disable_tls: false

ingress:
  # -- Enable ingress controller resource
  enabled: true
  # -- Annotations that define default ingress class, certificate issuer
  # @default -- check values.yaml
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    ingress.kubernetes.io/preserve-host: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/backend-protocol: https
  # -- Path within the url structure
  path: "/schema/?(.*)"
  # -- Ingress Path type
  pathType: ImplementationSpecific
  # -- IngressClass that will be be used to implement the Ingress (Kubernetes 1.18+)
  ingressClassName: nginx
  # -- Hosts to accept requests from
  hosts:
    - localhost
  tls:
    # -- TLS Secret Name
    secretName: radar-base-tls

gatewayAPI:
  # -- Enable Gateway API HTTPRoute resource (alternative to ingress). Opt-in:
  # requires the Gateway API CRDs and a Gateway controller to be installed.
  enabled: false
  # -- Annotations to add to the HTTPRoute
  annotations: {}
  # -- Parent Gateway that the HTTPRoute attaches to. The Gateway itself is a shared
  # resource and must be created separately (not by this chart).
  parentRef:
    # -- Name of the Gateway
    name: radar-base-k8s-gateway
    # -- Namespace of the Gateway (defaults to the release namespace when empty)
    namespace: ""
  # -- Hostnames the HTTPRoutes accept requests for (must intersect the Gateway
  # listener hostnames). String values support Helm templating (tpl); defaults to
  # serverName so deployments override it the same way as ingress.hosts.
  hostnames:
    - "{{ .Values.serverName }}"
  # -- HTTPS listener on the Gateway that the main route attaches to
  https:
    # -- Listener port (empty attaches to all matching listeners)
    port: 443
    # -- Listener sectionName on the Gateway (optional)
    sectionName: ""
  # -- Path match type (PathPrefix, Exact or RegularExpression)
  pathType: PathPrefix
  # -- Path to match within the URL structure
  path: /schema
  # -- HTTP method the route is restricted to (empty matches all methods)
  method: GET
  # -- Additional HTTPRoute filters (e.g. URLRewrite, RequestHeaderModifier)
  # Equivalent to the ingress annotations: strips the /schema prefix
  # (nginx.ingress.kubernetes.io/rewrite-target: /$1), sets the upstream Host header
  # (upstream-vhost) and injects the Confluent Cloud basic-auth header (configuration-snippet).
  # NOTE: like the ingress annotation, the credentials end up in the rendered resource.
  # @default -- check values.yaml
  filters:
    - type: URLRewrite
      urlRewrite:
        hostname: "{{ .Values.service.externalName }}"
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
          - name: Authorization
            value: 'Basic {{ printf "%s:%s" .Values.cc.schemaRegistryApiKey .Values.cc.schemaRegistryApiSecret | b64enc }}'
  # -- TLS from the gateway to the Confluent Cloud schema registry (equivalent to
  # nginx.ingress.kubernetes.io/backend-protocol: https). Creates a BackendTLSPolicy
  # targeting the Service.
  backendTLS:
    # -- Create the BackendTLSPolicy
    enabled: true
    # -- SNI/certificate hostname to validate (defaults to the external schema registry domain)
    hostname: "{{ .Values.service.externalName }}"
    # -- Well-known CA bundle used to validate the backend (System); ignored when caCertificateRefs is set
    wellKnownCACertificates: System
    # -- Custom CA ConfigMap references used to validate the backend (takes precedence over wellKnownCACertificates)
    caCertificateRefs: []
  # -- HTTP->HTTPS redirect route (equivalent to nginx force-TLS behaviour)
  httpsRedirect:
    # -- Enable a second HTTPRoute that 301-redirects HTTP traffic to HTTPS
    enabled: true
    # -- HTTP listener port on the Gateway to attach the redirect to
    port: 80
    # -- Listener sectionName on the Gateway (optional)
    sectionName: ""
    # -- Redirect HTTP status code
    statusCode: 301

cc:
  # -- Confluent cloud schema registry API key
  schemaRegistryApiKey: srApiKey
  # -- Confluent cloud schema registry API secret
  schemaRegistryApiSecret: srApiSecret

serverName: localhost
