
{{- /*
API secret key, managed by the parent chart.

Same rotation bug as the Fernet and JWT secrets: the upstream airflow subchart renders
`randAlphaNum 32` inline, so every `helm upgrade` mints a new `[api] secret_key`. This is the
key the api-server signs task-log fetch tokens with and the worker log server validates them
with, so any upgrade that rolls the two at different times leaves them on different keys and
every log request 403s with "Signature verification failed". It also invalidates UI sessions.

Resolved in this order, so an upgrade never rotates it silently:
  1. an explicit `apiSecretKey` value
  2. the value already stored in the live secret (via lookup)
  3. the value in the subchart-generated `<release>-api-secret-key`, so pinning an existing
     install does not itself log everyone out
  4. a freshly generated key, on first install only
*/}}
{{- if .Values.airflow.apiSecretKeySecretName }}
{{- $name := .Values.airflow.apiSecretKeySecretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $legacy := lookup "v1" "Secret" .Release.Namespace (printf "%s-api-secret-key" .Release.Name) }}
{{- $key := "" }}
{{- if .Values.apiSecretKey }}
{{- $key = .Values.apiSecretKey }}
{{- else if and $existing $existing.data (hasKey $existing.data "api-secret-key") }}
{{- $key = index $existing.data "api-secret-key" | b64dec }}
{{- else if and $legacy $legacy.data (hasKey $legacy.data "api-secret-key") }}
{{- $key = index $legacy.data "api-secret-key" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: radar-airflow
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  api-secret-key: {{ $key | quote }}
{{- end }}
