
{{- /*
Fernet key secret, managed by the parent chart.

The upstream airflow subchart renders `randAlphaNum 32` inline, so it mints a new key on
every `helm upgrade` and every row already encrypted with the previous key (trigger kwargs,
variables, connection passwords) becomes undecryptable. Setting `airflow.fernetKeySecretName`
switches the subchart to consuming a pre-existing secret; this template is what provides it.

The key is resolved in this order, so an upgrade never rotates it silently:
  1. an explicit `fernetKey` value
  2. the key already stored in the live secret (via lookup)
  3. a freshly generated key, on first install only
*/}}
{{- if .Values.airflow.fernetKeySecretName }}
{{- $name := .Values.airflow.fernetKeySecretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := "" }}
{{- if .Values.fernetKey }}
{{- $key = .Values.fernetKey }}
{{- else if and $existing $existing.data (hasKey $existing.data "fernet-key") }}
{{- $key = index $existing.data "fernet-key" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 32 | b64enc | replace "+" "-" | replace "/" "_" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: radar-airflow
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Outlive `helm uninstall`: dropping the key orphans every encrypted row in the metadata DB.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  fernet-key: {{ $key | quote }}
{{- end }}
