
{{- /*
JWT signing secret, managed by the parent chart.

Same problem as the Fernet key: the upstream airflow subchart renders `randAlphaNum 32`
inline, so every `helm upgrade` mints a new `[api_auth] jwt_secret`. The api-server picks the
new value up immediately while already-running workers and task pods keep the old one in their
env, so the JWTs the api-server signs for log fetching fail validation in the worker log
server ("jwt.exceptions.InvalidSignatureError: Signature verification failed") until every pod
happens to be restarted. Setting `airflow.jwtSecretName` switches the subchart to consuming a
pre-existing secret; this template is what provides it.

The secret is resolved in this order, so an upgrade never rotates it silently:
  1. an explicit `jwtSecret` value
  2. the value already stored in the live secret (via lookup)
  3. the value in the subchart-generated `<release>-jwt-secret`, so pinning an existing
     install does not itself invalidate the tokens currently in flight
  4. a freshly generated secret, on first install only
*/}}
{{- if .Values.airflow.jwtSecretName }}
{{- $name := .Values.airflow.jwtSecretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $legacy := lookup "v1" "Secret" .Release.Namespace (printf "%s-jwt-secret" .Release.Name) }}
{{- $key := "" }}
{{- if .Values.jwtSecret }}
{{- $key = .Values.jwtSecret }}
{{- else if and $existing $existing.data (hasKey $existing.data "jwt-secret") }}
{{- $key = index $existing.data "jwt-secret" | b64dec }}
{{- else if and $legacy $legacy.data (hasKey $legacy.data "jwt-secret") }}
{{- $key = index $legacy.data "jwt-secret" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: radar-airflow
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  jwt-secret: {{ $key | quote }}
{{- end }}
