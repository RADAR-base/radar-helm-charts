# Default values for radar-backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  # -- Image registry
  registry: docker.io
  # -- Image repository
  repository: radarbase/radar-backend
  # -- Image tag (immutable tags are recommended)
  # Overrides the image tag whose default is the chart appVersion.
  tag:
  # -- Image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
  digest: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Optionally specify an array of imagePullSecrets.
  # Secrets must be manually created in the namespace.
  # e.g:
  # pullSecrets:
  #   - myRegistryKeySecretName
  #
  pullSecrets: []

# -- String to partially override radar-backend.fullname template with a string (will prepend the release name)
nameOverride: ""
# -- String to fully override radar-backend.fullname template with a string
fullnameOverride: ""

# -- Configure radar-backend pods' Security Context
podSecurityContext: {}
  # fsGroup: 2000

# -- Configure radar-backend containers' Security Context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# -- Extra environment variables
extraEnvVars:
  - name: TOPIC_LIST
    value: "application_record_counts"

# -- Network policy defines who can access this application and who this applications has access to
# @default -- check `values.yaml`
networkpolicy:
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.0.0.0/8
        - 192.168.0.0/16
        - 172.16.0.0/12
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: '{{ .Release.Namespace }}'
      podSelector:
        matchLabels:
          app.kubernetes.io/name: 'radar-kafka-kafka-bootstrap'
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: '{{ .Release.Namespace }}'
      podSelector:
        matchLabels:
          app.kubernetes.io/name: 'radar-kafka-schema-registry'
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP

# command: "monitor"
# command: "stream"

envVars:
  STREAM_SECURITY_PROTOCOL: SASL_PLAINTEXT
  STREAM_SASL_MECHANISM: SCRAM-SHA-512

secret:
  # -- Secret for the Kafka SASL JAAS configuration
  jaas:
    name: shared-service-user
    key: sasl.jaas.config

zookeeper:
kafka: radar-kafka-kafka-bootstrap:9094
rest_proxy:
schema_registry: http://radar-kafka-schema-registry:8081
kafka_num_brokers: "3"

smtp:
  host: smtp
  port: 25
  user: user@example.com

persistence:
  enabled: false
  existingClaim:
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass:

config:
  stream:
    threads_per_priority:
      low: 1
      normal: 2
      high: 4
    properties:
      max.request.size: 3500042 #Set message.max.bytes for kafka brokers higher than or equal to this value
      retries: 15
      session.timeout.ms: 50000
      commit.interval.ms: 300000
      request.timeout.ms: 10860000
      state.cleanup.delay.ms: 10860000
    streams:
#      - class: org.radarbase.stream.empatica.E4AccelerationStream
#      - class: org.radarbase.stream.empatica.E4BatteryLevelStream
#      - class: org.radarbase.stream.empatica.E4BloodVolumePulseStream
#      - class: org.radarbase.stream.empatica.E4ElectroDermalActivityStream
#      - class: org.radarbase.stream.empatica.E4HeartRateStream
#      - class: org.radarbase.stream.empatica.E4InterBeatIntervalStream
#      - class: org.radarbase.stream.empatica.E4TemperatureStream
      - class: org.radarbase.stream.phone.PhoneAccelerationStream
      - class: org.radarbase.stream.phone.PhoneBatteryStream
      - class: org.radarbase.stream.phone.PhoneUsageStream
      - class: org.radarbase.stream.phone.PhoneUsageAggregationStream
    source_statistics:
#      - name: Empatica E4
#        topics:
#          - android_empatica_e4_blood_volume_pulse_1min
#        output_topic: source_statistics_empatica_e4
#      - name: Biovotion VSM1
#        topics:
#          - android_biovotion_vsm1_acceleration_1min
#        output_topic: source_statistics_biovotion_vsm1
      - name: RADAR pRMT
        topics:
          - android_phone_acceleration_1min
          - android_phone_bluetooth_devices
          - android_phone_sms
          - android_phone_call
          - android_phone_contacts
          - android_phone_usage_event
          - android_phone_relative_location
        output_topic: source_statistics_android_phone
  battery_monitor:
    level: LOW
    notify: # Each project can have a number of email addresses
      - project_id: s1
        email_address:
          - notifier1@email
      - project_id: s2
        email_address:
          - notifier2@email
    email_host: "{{ .Values.smtp.host }}"
    email_port: "{{ .Values.smtp.port }}"
    email_user: "{{ .Values.smtp.user }}"
    topics:
      - android_empatica_e4_battery_level
  disconnect_monitor:
    notify: # Each project can have a number of email addresses
      - project_id: s1
        email_address:
          - notifier1@email
      - project_id: s2
        email_address:
          - notifier2@email
    email_host: "{{ .Values.smtp.host }}"
    email_port: "{{ .Values.smtp.port }}"
    email_user: "{{ .Values.smtp.user }}"
    topics:
      - android_empatica_e4_temperature
    timeout: 1800  # seconds after which a stream is set disconnected
    alert_repetitions: 2  # number of additional emails to send after the first
  statistics_monitors:
#    - name: Empatica E4
#      topics:
#        - android_empatica_e4_blood_volume_pulse_1min
#      output_topic: source_statistics_empatica_e4
#    - name: Biovotion VSM1
#      topics:
#        - android_biovotion_vsm1_acceleration_1min
#      output_topic: source_statistics_biovotion_vsm1
    - name: RADAR pRMT
      topics:
        - android_phone_acceleration_1min
        - android_phone_bluetooth_devices
        - android_phone_sms
        - android_phone_call
        - android_phone_contacts
        - android_phone_usage_event
        - android_phone_relative_location
      output_topic: source_statistics_android_phone
  persistence_path: /var/lib/radar/data
