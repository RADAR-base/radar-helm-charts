{{- if .Values.gatewayAPI.enabled -}}
{{- $fullName := include "radar-grafana.fullname" . -}}
{{- $svcName := include "radar-grafana.grafanaServiceName" . -}}
{{- $svcPort := (.Values.grafana.service).port | default 80 -}}
{{- $ns := .Release.Namespace -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  namespace: {{ $ns | quote }}
  labels: {{- include "radar-grafana.labels" . | nindent 4 }}
  {{- with .Values.gatewayAPI.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayAPI.parentRef.name }}
      {{- with .Values.gatewayAPI.parentRef.namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .Values.gatewayAPI.https.port }}
      port: {{ . }}
      {{- end }}
      {{- with .Values.gatewayAPI.https.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  {{- with .Values.gatewayAPI.hostnames }}
  hostnames:
    {{- range . }}
    - {{ ( tpl . $ ) | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.gatewayAPI.pathType | default "PathPrefix" }}
            value: {{ .Values.gatewayAPI.path | quote }}
      {{- with .Values.gatewayAPI.filters }}
      filters: {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ $svcName }}
          port: {{ $svcPort }}
{{- if .Values.gatewayAPI.httpsRedirect.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-http-redirect
  namespace: {{ $ns | quote }}
  labels: {{- include "radar-grafana.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayAPI.parentRef.name }}
      {{- with .Values.gatewayAPI.parentRef.namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .Values.gatewayAPI.httpsRedirect.port }}
      port: {{ . }}
      {{- end }}
      {{- with .Values.gatewayAPI.httpsRedirect.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  {{- with .Values.gatewayAPI.hostnames }}
  hostnames:
    {{- range . }}
    - {{ ( tpl . $ ) | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.gatewayAPI.pathType | default "PathPrefix" }}
            value: {{ .Values.gatewayAPI.path | quote }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: {{ .Values.gatewayAPI.httpsRedirect.statusCode | default 301 }}
{{- end }}
{{- end }}
