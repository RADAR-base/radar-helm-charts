# -- Grafana Helm Chart configuration
# @default -- check 'values.yaml'
grafana:

  # -- Hostname for the Grafana service
  server_name: localhost
  # -- Protocol for the Grafana service (allowed values: http, https)
  advertised_protocol: https

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    ingressClassName: nginx
    path: /
    pathType: Prefix
    hosts:
      - 'dashboard.{{ .Values.server_name }}'
    tls:
      - secretName: radar-base-tls-dashboard
        hosts:
          - 'dashboard.{{ .Values.server_name }}'

  image:
    registry: docker.io
    repository: grafana/grafana

  downloadDashboardsImage:
    registry: docker.io
    repository: curlimages/curl

  downloadDashboards:
    env:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/allprojects/home.json

  persistence:
    type: pvc
    enabled: true
    size: 10Gi

  envValueFrom:
    POSTGRES_USER:
      secretKeyRef:
        name: grafana-timescaledb-app
        key: username
    POSTGRES_PASSWORD:
      secretKeyRef:
        name: grafana-timescaledb-app
        key: password
    POSTGRES_DB:
      secretKeyRef:
        name: grafana-timescaledb-app
        key: dbname
    POSTGRES_HOST:
      secretKeyRef:
        name: grafana-timescaledb-app
        key: host

  env:
    GF_USERS_DEFAULT_THEME: light

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - id: 1
          orgId: 1
          name: PostgreSQL
          type: postgres
          typeLogoUrl: public/app/plugins/datasource/postgres/img/postgresql_logo.svg
          access: proxy
          url: ${POSTGRES_HOST}
          secureJsonData:
            password: ${POSTGRES_PASSWORD}
          user: ${POSTGRES_USER}
          database: ${POSTGRES_DB}
          basicAuth: false
          isDefault: true
          jsonData:
            postgresVersion: 1200
            timescaledb: true
            sslmode: disable
          readOnly: true

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'allprojects'
        orgId: 1
        folder: 'All Projects'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/allprojects

  grafana.ini:
    server:
      root_url: '{{ .Values.advertised_protocol }}://dashboard.{{ .Values.server_name }}/'
      domain: "{{ if (and .Values.ingress.enabled .Values.ingress.hosts) }}{{ .Values.ingress.hosts | first }}{{ else }}''{{ end }}"
    users:
      auto_assign_org: true
      auto_assign_org_role: Editor
    auth.generic_oauth:
      name: managementportal
      enabled: true
      auth_url: '{{ .Values.advertised_protocol }}://{{ .Values.server_name }}/managementportal/oauth/authorize'
      token_url: '{{ .Values.advertised_protocol }}://{{ .Values.server_name }}/managementportal/oauth/token'
      api_url: http://management-portal:8080/managementportal/api/account
      client_id: grafana_dashboard
      # Fix for https://github.com/grafana/grafana/issues/70203#issuecomment-1798601871
      oauth_allow_insecure_email_lookup: true
      # client_secret: ""
      empty_scopes: true

  sidecar:
    image:
      registry: quay.io
      repository: kiwigrid/k8s-sidecar
    alerts:
      reloadURL: "'{{ .Values.advertised_protocol }}://{{ .Values.server_name }}:3000/api/admin/provisioning/alerting/reload"
    dashboards:
      reloadURL: "'{{ .Values.advertised_protocol }}://{{ .Values.server_name }}:3000/api/admin/provisioning/dashboards/reload"
    datasources:
      reloadURL: "'{{ .Values.advertised_protocol }}://{{ .Values.server_name }}:3000/api/admin/provisioning/datasources/reload"
    plugins:
      reloadURL: "'{{ .Values.advertised_protocol }}://{{ .Values.server_name }}:3000/api/admin/provisioning/plugins/reload"
    notifiers:
      reloadURL: "'{{ .Values.advertised_protocol }}://{{ .Values.server_name }}:3000/api/admin/provisioning/notifications/reload"

  assertNoLeakedSecrets: false

# Pod Disruption Budget configuration
gatewayAPI:
  # -- Enable Gateway API HTTPRoute resource (alternative to grafana.ingress). Opt-in:
  # requires the Gateway API CRDs and a Gateway controller to be installed.
  enabled: false
  # -- Annotations to add to the HTTPRoute
  annotations: {}
  # -- Parent Gateway that the HTTPRoute attaches to. The Gateway itself is a shared
  # resource and must be created separately (not by this chart).
  parentRef:
    # -- Name of the Gateway
    name: radar-base-k8s-gateway
    # -- Namespace of the Gateway (defaults to the release namespace when empty)
    namespace: ""
  # -- Hostnames the HTTPRoutes accept requests for (must intersect the Gateway
  # listener hostnames). String values support Helm templating (tpl); defaults to
  # dashboard.<grafana.server_name> so deployments override it the same way as grafana.ingress.hosts.
  hostnames:
    - 'dashboard.{{ .Values.grafana.server_name }}'
  # -- HTTPS listener on the Gateway that the main route attaches to
  https:
    # -- Listener port (empty attaches to all matching listeners)
    port: 443
    # -- Listener sectionName on the Gateway (optional)
    sectionName: ""
  # -- Path match type (PathPrefix, Exact or RegularExpression)
  pathType: PathPrefix
  # -- Path to match within the URL structure
  path: /
  # -- Additional HTTPRoute filters (e.g. URLRewrite, RequestHeaderModifier)
  filters: []
  # -- HTTP->HTTPS redirect route (equivalent to nginx force-TLS behaviour)
  httpsRedirect:
    # -- Enable a second HTTPRoute that 301-redirects HTTP traffic to HTTPS
    enabled: true
    # -- HTTP listener port on the Gateway to attach the redirect to
    port: 80
    # -- Listener sectionName on the Gateway (optional)
    sectionName: ""
    # -- Redirect HTTP status code
    statusCode: 301

podDisruptionBudget:
  # -- Enable Pod Disruption Budget
  enabled: false
  # -- Minimum number of pods that must be available during disruptions
  minAvailable: 1
  # -- Maximum number of pods that can be unavailable during disruptions
  maxUnavailable: ~
