serverName: localhost
advertised_protocol: https

nifikop:
  # -- Deploy the nifikop operator.
  enabled: true

auth:

  # -- OpenID Connect configuration (not functional at the moment, included for reference).
  oidc:
    enabled: false
#    wellKnownConfigUrl: http://idp/.well-known/openid-configuration
#    #    redirectUrl: '{{ printf "%s://nifi.%s/*" .Values.advertised_protocol .Values.serverName }}'
#    scopes: openid,profile,email
#    clientIdSecret:
#      name: nifi-oauth-client-secret
#      key: clientId
#    clientSecretSecret:
#      name: nifi-oauth-client-secret
#      key: clientSecret

  # -- Single user authentication configuration
  singleUser:
    username: admin
    # -- Password for the single admin user.
    # Make sure it's at least 12 characters long.'
    password: changemechangeme

# -- Nifi Cluster configuration
# @default -- check `values.yaml`
nifi-secret-properties:
nifi-properties:
  nifi.web.proxy.context.path: /
  nifi.web.proxy.scheme: '{{ .Values.advertised_protocol }}'
  nifi.web.http.network.interface.default: eth0
  nifi.web.http.network.interface.lo: lo
  nifi.nar.library.autoload.directory: ../extensions

nifi-cluster:
  cluster:
    nodeUserIdentityTemplate: node-%d-nifikop
    image:
      tag: "2.5.0"
    manager: kubernetes
    # Defaults to the fullname.
    # managerServiceAccount:
    #  name: radar-nifi-nifi-cluster
    bootstrapProperties:
      overrideConfigs: |
        java.arg.4=-Djava.net.preferIPv4Stack=true
        java.arg.log4shell=-Dlog4j2.formatMsgNoLookups=true
        # Java 8 Tuning see https://community.hortonworks.com/articles/7882/hdfnifi-best-practices-for-setting-up-a-high-perfo.html for references
        java.arg.7=-XX:ReservedCodeCacheSize=256m
        java.arg.8=-XX:+UseCodeCacheFlushing
      nifiJvmMemory: 2g
    nifiProperties:
      overrideConfigMap:
        name: radar-nifi-properties
        data: nifi.properties
      overrideSecretConfig:
        name: radar-nifi-secret-properties
        data: nifi-secret.properties
      # -- Must follow the full public address of the Nifi cluster, including port and context path.
      webProxyHosts:
        - nifi.localhost:8443
    singleUserConfiguration:
      enabled: true
      authorizerEnabled: true
      secretRef:
        name: nifi-single-user-credentials
        namespace: default
    listenersConfig:
      internalListeners:
        - type: https
          name: https
          containerPort: 8443
        - type: cluster
          name: cluster
          containerPort: 6007
        - type: s2s
          name: s2s
          containerPort: 10000
      sslSecrets:
        tlsSecretName: radar-nifi-tls
        create: true
    nifiClusterTaskSpec:
      retryDurationMinutes: 10
    initContainers:
      - name: download-postgres-driver
        image: curlimages/curl:8.12.1
        command:
          - sh
          - -c
          - |
            curl -L -o /jdbc/postgresql-42.7.5.jar \
              https://jdbc.postgresql.org/download/postgresql-42.7.5.jar
        volumeMounts:
          - name: jdbc-drivers
            mountPath: /jdbc
      - name: download-postgres-nar
        image: curlimages/curl:8.12.1
        command:
          - sh
          - -c
          - |
            curl -L -o /extensions/nifi-dbcp-service-nar-2.5.0.nar \
              https://repo1.maven.org/maven2/org/apache/nifi/nifi-dbcp-service-nar/2.5.0/nifi-dbcp-service-nar-2.5.0.nar
        volumeMounts:
          - name: extensions
            mountPath: /extensions
    nodeConfigGroups:
      default_group:
        fsGroup: 1337
        isNode: true
        resourcesRequirements:
          limits:
            cpu: 2
            memory: 3Gi
          requests:
            cpu: 1
            memory: 2Gi
        # Must reference managerServiceAccount (defaults to fullname)
        serviceAccountName: radar-nifi-nifi-cluster
        storageConfigs:
          - mountPath: /opt/nifi/flowfile_repository
            name: flowfile-repository
            pvcSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
          - mountPath: /opt/nifi/nifi-current/conf
            name: conf
            pvcSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 500m
          - mountPath: /opt/nifi/content_repository
            name: content-repository-default
            pvcSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
          - mountPath: /opt/nifi/provenance_repository
            name: provenance-repository-default
            pvcSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
          # In nifi 2.x this is the new path for persistent storage.
          - mountPath: /opt/nifi/data
            name: data
            pvcSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
        externalVolumeConfigs:
          - name: jdbc-drivers
            mountPath: /opt/nifi/jdbc
            emptyDir: {}
          - name: extensions
            mountPath: /opt/nifi/extensions
            emptyDir: {}
    nodes:
      - id: 0
        labels:
          nifi_node_group: default_group
        nodeConfigGroup: default_group
    propagateLabels: false
    service:
      headlessEnabled: true
    maximumTimerDrivenThreadCount: 40

  ingress:
    enabled: false

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
    cert-manager.io/cluster-issuer: self-signed-issuer
  hostname: 'nifi.{{ $.Values.serverName }}'
  ingressClassName: nginx
  path: /
  pathType: ImplementationSpecific
  backend: '{{ include "common.names.fullname" . }}-nifi-cluster-headless'
  tls: true
  existingSecret: radar-nifi-tls

gatewayAPI:
  # -- Enable Gateway API HTTPRoute resource (alternative to ingress). Opt-in:
  # requires the Gateway API CRDs and a Gateway controller to be installed.
  enabled: false
  # -- Annotations to add to the HTTPRoute
  annotations: {}
  # -- Parent Gateway that the HTTPRoute attaches to. The Gateway itself is a shared
  # resource and must be created separately (not by this chart).
  parentRef:
    # -- Name of the Gateway
    name: radar-base-k8s-gateway
    # -- Namespace of the Gateway (defaults to the release namespace when empty)
    namespace: ""
  # -- Hostnames the HTTPRoutes accept requests for (must intersect the Gateway
  # listener hostnames). String values support Helm templating (tpl); defaults to
  # serverName so deployments override it the same way as ingress.hosts.
  hostnames:
    - 'nifi.{{ .Values.serverName }}'
  # -- HTTPS listener on the Gateway that the main route attaches to
  https:
    # -- Listener port (empty attaches to all matching listeners)
    port: 443
    # -- Listener sectionName on the Gateway (optional)
    sectionName: ""
  # -- Path match type (PathPrefix, Exact or RegularExpression)
  pathType: PathPrefix
  # -- Path to match within the URL structure
  path: /
  # -- Backend Service (the NiFi headless service) and port the route forwards to
  # @default -- check values.yaml
  backend:
    name: '{{ include "common.names.fullname" . }}-nifi-cluster-headless'
    port: 8443
  # -- Additional HTTPRoute filters (e.g. URLRewrite, RequestHeaderModifier)
  # NOTE: the ingress's cookie-based session affinity (nginx.ingress.kubernetes.io/affinity and
  # related session-cookie-* annotations) has no HTTPRoute equivalent and is NOT replicated here;
  # configure it with your Gateway controller's policies if required.
  filters: []
  # -- TLS from the gateway to the NiFi pods (equivalent to nginx.ingress.kubernetes.io/backend-protocol: HTTPS).
  # Creates a BackendTLSPolicy targeting the backend Service. NiFi uses a self-signed
  # certificate, so the CA must be provided as a ConfigMap (key ca.crt) in the release namespace.
  backendTLS:
    # -- Create the BackendTLSPolicy
    enabled: true
    # -- Certificate hostname to validate against the NiFi server certificate
    hostname: 'nifi.{{ $.Values.serverName }}'
    # -- Well-known CA bundle (System); ignored when caCertificateRefs is set
    wellKnownCACertificates: System
    # -- CA ConfigMap references used to validate the NiFi certificate
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: radar-nifi-ca
  # -- HTTP->HTTPS redirect route (equivalent to nginx force-TLS behaviour)
  httpsRedirect:
    # -- Enable a second HTTPRoute that 301-redirects HTTP traffic to HTTPS
    enabled: true
    # -- HTTP listener port on the Gateway to attach the redirect to
    port: 80
    # -- Listener sectionName on the Gateway (optional)
    sectionName: ""
    # -- Redirect HTTP status code
    statusCode: 301

