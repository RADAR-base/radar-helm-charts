# Default values for radar-push-endpoint.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of radar-push-endpoint replicas to deploy
replicaCount: 2

image:
  # -- Image registry
  registry: docker.io
  # -- Image repository
  repository: radarbase/radar-push-endpoint
  # -- Image tag (immutable tags are recommended)
  # Overrides the image tag whose default is the chart appVersion.
  tag:
  # -- Image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
  digest: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Optionally specify an array of imagePullSecrets.
  # Secrets must be manually created in the namespace.
  # e.g:
  # pullSecrets:
  #   - myRegistryKeySecretName
  #
  pullSecrets: []

image_exporter:
  # -- Image registry
  registry: docker.io
  # -- Image repository
  repository: sscaling/jmx-prometheus-exporter
  # -- Image tag (immutable tags are recommended)
  # Overrides the image tag whose default is the chart appVersion.
  tag:
  # -- Image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
  digest: "sha256:48e3bd31f132146751e449429a3e8a260b141f2acd587878fc50b3eda4466c5d"
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Optionally specify an array of imagePullSecrets.
  # Secrets must be manually created in the namespace.
  # e.g:
  # pullSecrets:
  #   - myRegistryKeySecretName
  #
  pullSecrets: []

# -- String to partially override radar-push-endpoint.fullname template with a string (will prepend the release name)
nameOverride: ""
# -- String to fully override radar-push-endpoint.fullname template with a string
fullnameOverride: ""

# -- Configure radar-push-endpoint pods' Security Context
podSecurityContext: {}
  # fsGroup: 2000

# -- Configure radar-push-endpoint containers' Security Context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # -- Kubernetes Service type
  type: ClusterIP
  # -- radar-push-endpoint port
  port: 8090

# -- Reconfigure Ingress to not force TLS
disable_tls: false

ingress:
  # -- Enable ingress controller resource
  enabled: true
  # -- Annotations that define default ingress class, certificate issuer and deny access to sensitive URLs
  # @default -- check values.yaml
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # The application serves under /push/integrations/, so the public /push-endpoint prefix has to be
    # rewritten onto it. Without this, every path below /push-endpoint (Garmin and Google Health alike)
    # reaches the container unrewritten and 404s.
    nginx.ingress.kubernetes.io/rewrite-target: /push/integrations/$1
    nginx.ingress.kubernetes.io/server-snippet: |
      location /push-endpoint/garmin {
        # set client body size to 20M #
        client_max_body_size 20M;

        # restrict access to only certain IPs provided by Garmin Health API
        allow 204.77.162.0/23;
        allow 98.199.124.0/23;
        allow 185.132.79.0/24;
        allow 208.65.206.0/23;
        allow 185.207.94.0/23;
        allow 198.233.176.0/24;
        deny all;
      }
  # -- Path within the url structure. Regex capture feeding `rewrite-target` above.
  path: "/push-endpoint/?(.*)"
  # -- Ingress Path type
  pathType: ImplementationSpecific
  # -- IngressClass that will be be used to implement the Ingress (Kubernetes 1.18+)
  ingressClassName: nginx
  # -- Hosts to accept requests from
  hosts:
    - localhost
  tls:
    # -- Name of the secret that contains TLS certificates
    secretName: radar-base-tls

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # -- CPU/Memory resource limits
  # limits:
  #   cpu: 2
  #   memory: 1.7Gi

  # -- CPU/Memory resource requests
  requests:
    cpu: 100m
    memory: 128Mi

# -- Node labels for pod assignment
nodeSelector: {}

# -- Toleration labels for pod assignment
tolerations: []

# -- Affinity labels for pod assignment
affinity: {}

# -- Extra environment variables
extraEnvVars: []
#  - name: BEARER_AUTH
#    value: true

# -- Custom livenessProbe that overrides the default one
customLivenessProbe: {}

livenessProbe:
  # -- Enable livenessProbe
  enabled: true
  # -- Initial delay seconds for livenessProbe
  initialDelaySeconds: 5
  # -- Period seconds for livenessProbe
  periodSeconds: 30
  # -- Timeout seconds for livenessProbe
  timeoutSeconds: 5
  # -- Success threshold for livenessProbe
  successThreshold: 1
  # -- Failure threshold for livenessProbe
  failureThreshold: 3

# -- Custom readinessProbe that overrides the default one
customReadinessProbe: {}

readinessProbe:
  # -- Enable readinessProbe
  enabled: true
  # -- Initial delay seconds for readinessProbe
  initialDelaySeconds: 5
  # -- Period seconds for readinessProbe
  periodSeconds: 30
  # -- Timeout seconds for readinessProbe
  timeoutSeconds: 5
  # -- Success threshold for readinessProbe
  successThreshold: 1
  # -- Failure threshold for readinessProbe
  failureThreshold: 3

# -- Custom startupProbe that overrides the default one
customStartupProbe: {}

startupProbe:
  # -- Enable startupProbe
  enabled: true
  # -- Initial delay seconds for startupProbe
  initialDelaySeconds: 5
  # -- Period seconds for startupProbe
  periodSeconds: 10
  # -- Timeout seconds for startupProbe
  timeoutSeconds: 10
  # -- Success threshold for startupProbe
  successThreshold: 1
  # -- Failure threshold for startupProbe
  failureThreshold: 30

serviceMonitor:
  # -- Enable metrics to be collected via Prometheus-operator
  enabled: true

hpa:
  # -- Enable HPA
  enabled: false
  # -- Maximum number of replicas
  maxReplicas: "5"
  # -- Target CPU utilization percentage
  targetCPU: "80"
  # -- Target Memory utilization percentage
  targetMemory: ~

# -- Network policy defines who can access this application and who this applications has access to
# @default -- check `values.yaml`
networkpolicy:
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: '{{ .Release.Namespace }}'
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.0.0.0/8
        - 192.168.0.0/16
        - 172.16.0.0/12
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: '{{ .Release.Namespace }}'
      podSelector:
        matchLabels:
          app.kubernetes.io/name: 'radar-kafka-schema-registry'
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: '{{ .Release.Namespace }}'
      podSelector:
        matchLabels:
          app.kubernetes.io/name: 'radar-kafka-kafka-bootstrap'
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: '{{ .Release.Namespace }}'
      podSelector:
        matchLabels:
          app.kubernetes.io/name: 'radar-redis'
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: '{{ .Release.Namespace }}'
      podSelector:
        matchLabels:
          app.kubernetes.io/name: 'radar-rest-sources-backend'
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: '{{ .Release.Namespace }}'
      podSelector:
        matchLabels:
          app.kubernetes.io/name: 'management-portal'
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP

# -- Schema Registry URL
schemaRegistry: http://radar-kafka-schema-registry:8081
# -- Not used. To be confirmed
max_requests: 1000
# -- Kafka broker URLs
bootstrapServers: radar-kafka-kafka-bootstrap:9094
# -- set to true, if sources in access token should be validated
checkSourceId: true
# -- Additional Kafka Admin Client settings as key value pairs. Read from https://kafka.apache.org/documentation/#adminclientconfigs.
adminProperties:
  # -- Protocol used to communicate with brokers. Valid values are: PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL.
  security.protocol: SASL_PLAINTEXT
  # -- Mechanism used to authenticate with SASL. Valid values are: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512.
  sasl.mechanism: SCRAM-SHA-512
# -- Kafka producer properties as key value pairs. Read from https://kafka.apache.org/documentation/#producerconfigs.
producerProperties:
  # -- Protocol used to communicate with brokers. Valid values are: PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL.
  security.protocol: SASL_PLAINTEXT
  # -- Mechanism used to authenticate with SASL. Valid values are: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512.
  sasl.mechanism: SCRAM-SHA-512
  compression.type: lz4
# -- Additional Kafka serialization settings, used in KafkaAvroSerializer. Read from [io.confluent.kafka.serializers.AbstractKafkaSchemaSetDeConfig].
serializationProperties: {}

secret:
  admin:
    # -- Secret for the Kafka SASL JAAS configuration
    jaas:
      name: shared-service-user
      key: sasl.jaas.config
  producer:
    # -- Secret for the Kafka SASL JAAS configuration
    jaas:
      name: shared-service-user
      key: sasl.jaas.config

cc:
  # -- set to true, if requests should be forwarded to Confluent Cloud based brokers.
  enabled: false
  # -- Confluent Cloud cluster API key
  apiKey: ccApikey
  # -- Confluent Cloud cluster API secret
  apiSecret: ccApiSecret
  # -- Confluent Cloud schema registry API key
  schemaRegistryApiKey: srApiKey
  # -- Confluent Cloud schema registry API secret
  schemaRegistryApiSecret: srApiSecret

garmin:
  # -- Whether to enable Garmin endpoints
  enabled: true
  # -- OAuth version to use: "oauth2" for PKCE flow, "oauth1" for legacy flow. Only understood by
  # PushEndpoint builds that carry the Garmin OAuth2 migration; other builds reject the unknown key and
  # refuse to start, so leave this empty to omit it from the config entirely.
  oauthVersion: ""
  # -- Consumer key for you application in Garmin Health API developer portal
  consumerKey: "consumerKey"
  # -- Consumer secret for you application in Garmin Health API developer portal
  consumerSecret: "consumerSecret"
  # -- The user repository to use for getting list of users and their authorization information
  userRepositoryClass: "org.radarbase.push.integration.garmin.user.GarminServiceUserRepository"
  # -- The base url of the user repository if the repository is http(s) based.
  userRepositoryUrl: "http://radar-rest-sources-backend:8080/rest-sources/backend"
  # -- The client ID to access the user repository if the repository requires authorization
  userRepositoryClientId: "radar_push_endpoint"
  # -- The client secret to access the user repository if the repository requires authorization
  userRepositoryClientSecret: "secret"
  # -- The token URL for authentication (Usually the management portal token url). Make sure to avoid trailing slash (/) in the url.
  userRepositoryTokenUrl: "http://management-portal:8080/managementportal/oauth/token"
  backfill:
    # -- Whether to enable Garmin backfill requests
    enabled: true
    # -- Whether to enable Garmin backfill requests for activities
    activitiesEnabled: true
    # -- Whether to enable Garmin backfill requests for activity details
    activityDetailsEnabled: true
    # -- Whether to enable Garmin backfill requests for body composition
    bodyCompositionsEnabled: true
    # -- Whether to enable Garmin backfill requests for dailies
    dailiesEnabled: true
    # -- Whether to enable Garmin backfill requests for epoch summaries
    epochSummariesEnabled: true
    # -- Whether to enable Garmin backfill requests for pulse oximeter
    pulseOXEnabled: true
    # -- Whether to enable Garmin backfill requests for sleep
    sleepsEnabled: true
    # -- Whether to enable Garmin backfill requests for stress
    stressEnabled: true
    # -- Whether to enable Garmin backfill requests for user metrics
    userMetricsEnabled: true
    # -- Whether to enable Garmin backfill requests for moveIQ
    moveIQEnabled: true
    # -- Whether to enable Garmin backfill requests for respiration
    respirationEnabled: true
    # -- Whether to enable blood pressure backfill requests
    bloodPressureEnabled: false
    # -- Whether to enable health snapshot backfill requests
    healthSnapshotEnabled: false
    # -- Whether to enable heart rate variability backfill requests
    heartRateVariabilityEnabled: false

googlehealth:
  # -- Whether to enable the Google Health API integration (webhook receiver, subscriber registration and backfill)
  enabled: false
  # -- The user repository to use for getting list of users and their authorization information
  userRepositoryClass: "org.radarbase.push.integration.google.user.GoogleHealthServiceUserRepository"
  # -- The base url of the user repository (the Rest Source Auth backend)
  userRepositoryUrl: "http://radar-rest-sources-backend:8080/rest-sources/backend/"
  # -- The client ID to access the user repository
  userRepositoryClientId: "radar_pushendpoint"
  # -- The client secret to access the user repository
  userRepositoryClientSecret: "secret"
  # -- The token URL to authenticate against the user repository
  userRepositoryTokenUrl: "http://radar-rest-sources-backend:8080/rest-sources/backend/token/"
  # -- Base URL of the Google Health API
  apiBaseUrl: "https://health.googleapis.com/v4"
  # -- Google Cloud project that owns the Health API subscriber. Required when `googlehealth.enabled` is true.
  googleCloudProjectId: ""
  # -- Subscriber id registered with Google. MUST be unique per deployment (e.g. radar-pep-stage) and MUST
  # match `googleHealth.subscriberId` in the radar-rest-sources-backend chart, which hangs the per-user
  # subscriptions off this subscriber.
  subscriberId: "radar-pep"
  # -- Publicly reachable URL Google delivers webhook PINGs to, e.g.
  # https://<serverName>/push-endpoint/googlehealth/notifications
  subscriberEndpointUri: ""
  # -- 32+ byte random string. Google echoes it back as the Authorization header on every PING.
  subscriberSecret: ""
  # -- How Google creates per-user subscriptions for this subscriber (MANUAL or AUTOMATIC). Keep MANUAL:
  # the Rest Source Auth backend creates and deletes the subscriptions explicitly.
  subscriptionCreatePolicy: MANUAL
  serviceAccount:
    # -- Path the Google service-account JSON is mounted at inside the container. Also passed as
    # GOOGLE_HEALTH_SERVICE_ACCOUNT_PATH. Without a readable key, subscriber registration does not run.
    path: /etc/google/gha-service-account.json
    # -- Inline service-account JSON, rendered into this chart's ConfigMap under the `ghaServiceAccountKey`
    # key. Testing only — it ends up in plain text in the ConfigMap; move it to a Secret before this goes
    # anywhere real. Defaults to `{}` so the key is always present and can be filled in with `kubectl edit
    # cm <release>-radar-push-endpoint` (followed by `kubectl rollout restart`, since subPath mounts do not
    # refresh in place).
    key: ""
  # -- Data types the subscriber subscribes to, i.e. the ones that generate PINGs. MUST stay identical to
  # `googleHealth.dataTypes` in the radar-rest-sources-backend chart, which subscribes each user to the same
  # set — a type listed there but not here never yields a webhook trigger.
  triggerDataTypes:
    - steps
    - heart-rate
    - heart-rate-variability
    - daily-resting-heart-rate
    - respiratory-rate-sleep-summary
    - daily-sleep-temperature-derivations
    - sleep
    - exercise
    - floors
    - sedentary-period
    - activity-level
  # -- All data types fetched and produced to Kafka. Superset of `triggerDataTypes`; non-trigger types are
  # caught up via the offset cursor rather than by a PING.
  enabledDataTypes:
    - steps
    - heart-rate
    - heart-rate-variability
    - oxygen-saturation
    - total-calories
    - daily-resting-heart-rate
    - respiratory-rate-sleep-summary
    - daily-sleep-temperature-derivations
    - sleep
    - exercise
    - electrocardiogram
    - irregular-rhythm-notification
    - floors
    - sedentary-period
    - activity-level
  # -- Whether to fetch the TCX route/track detail attached to exercise sessions
  exerciseTcxEnabled: true
  # -- Whether to collect electrocardiogram waveforms. Large payloads and no webhook, so off by default.
  electrocardiogramEnabled: false
  backfill:
    # -- Whether to enable historical backfill of Google Health data
    enabled: true
    # -- Number of threads used by the backfill workers
    maxThreads: 4
    # -- Size in days of a single backfill request window
    chunkSizeDays: 7
    # -- Minutes between two backfill iterations
    iterationIntervalMinutes: 10
    # -- Key prefix for the redis locks used to coordinate backfill across replicas
    lockPrefix: radar-push-googlehealth/lock

redis:
  # -- The redis server URL. Redis is used to keep track of garmin backfill progress and any other key value properties.
  url: "redis://radar-redis-replication-master:6379"

# Pod Disruption Budget configuration
podDisruptionBudget:
  # -- Enable Pod Disruption Budget
  enabled: false
  # -- Minimum number of pods that must be available during disruptions
  minAvailable: 1
  # -- Maximum number of pods that can be unavailable during disruptions
  maxUnavailable: ~
