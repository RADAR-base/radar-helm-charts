{{- $restSourceClients := trim (include "radar-rest-sources-backend.enabledMapElementsAsList" .Values.restSourceClients) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  authorizer.yml: |
    service:
      # Interval time in minutes for syncing projects and subjects.
      baseUri: http://0.0.0.0:8080/rest-sources/backend/
      advertisedBaseUri: {{ printf "%s://%s/rest-sources/backend" .Values.advertised_protocol .Values.serverName }}
      enableCors: true
      syncParticipantsIntervalMin: 2
      {{- if .Values.authorizer -}}
      {{ .Values.authorizer | toYaml | nindent 6 }}
      {{- end }}

    auth:
      # Management Portal URL
      managementPortalUrl: {{ .Values.managementportal_url }}
      # OAuth2 Auth URL for MP Client
      authUrl: {{ .Values.auth_url }}
      # OAuth2 Client id of rest sources authorizer backend
      clientId: radar_rest_sources_auth_backend
      # OAuth2 Client Secret of rest sources authorizer backend client
      clientSecret: {{ .Values.client_secret }}
      # List of public key endpoints for token verification
      jwksUrls:
        {{- if .Values.public_key_endpoints }}
        {{- range .Values.public_key_endpoints }}
        - {{ . | quote }}
        {{- end }}
        {{- else }}
        []
        {{- end }}

    database:
      driver: org.postgresql.Driver
      dialect: org.hibernate.dialect.PostgreSQLDialect

    restSourceClients:
    {{- if $restSourceClients }}
      {{- $restSourceClients | nindent 6 }}
    {{- else }} []
    {{- end }}

    {{- if .Values.redis.uri }}
    redis:
        uri: {{ .Values.redis.uri }}
    {{- end }}

    {{- if .Values.googleHealth.enabled }}
    # Per-user Google Health webhook subscriptions, keyed by the sourceType of the client they belong
    # to. The subscriber they hang off is registered by the Push Endpoint (radar-push-endpoint chart),
    # which receives the webhooks; only the per-user subscriptions are managed here.
    restSourceClientSubscriptions:
      googlehealth:
        enabled: true
        serviceAccountKeyPath: /etc/google/gha-service-account.json
        apiBaseUrl: {{ .Values.googleHealth.apiBaseUrl }}
        googleCloudProjectId: {{ .Values.googleHealth.googleCloudProjectId | quote }}
        # MUST match the Push Endpoint subscriberId
        subscriberId: {{ .Values.googleHealth.subscriberId }}
        reconcileIntervalMinutes: {{ .Values.googleHealth.reconcileIntervalMinutes }}
        reconcileMaxDeletesPerPass: {{ .Values.googleHealth.reconcileMaxDeletesPerPass }}
        # MUST stay identical to the Push Endpoint's pushIntegration.googlehealth.triggerDataTypes.
        dataTypes:
          {{- range .Values.googleHealth.dataTypes }}
          - {{ . }}
          {{- end }}
    {{- end }}
