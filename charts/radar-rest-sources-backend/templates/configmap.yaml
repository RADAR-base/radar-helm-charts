{{/*
Per-user Google Health webhook subscriptions are configured on the GoogleHealth client itself, so
the .Values.googleHealth settings are folded into that client as its `subscription` block. The
subscriber they hang off is registered by the Push Endpoint (radar-push-endpoint chart), which
receives the webhooks; only the per-user subscriptions are created, deleted and reconciled here.
*/}}
{{- $clients := deepCopy .Values.restSourceClients -}}
{{- if .Values.googleHealth.enabled -}}
{{- $subscription := merge (dict "serviceAccountKeyPath" .Values.googleHealth.serviceAccount.path) (omit .Values.googleHealth "serviceAccount") -}}
{{- range $id, $client := $clients -}}
{{- if eq (toString $client.sourceType) "GoogleHealth" -}}
{{- $_ := set $client "subscription" $subscription -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $restSourceClients := trim (include "radar-rest-sources-backend.enabledMapElementsAsList" $clients) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  authorizer.yml: |
    service:
      # Interval time in minutes for syncing projects and subjects.
      baseUri: http://0.0.0.0:8080/rest-sources/backend/
      advertisedBaseUri: {{ printf "%s://%s/rest-sources/backend" .Values.advertised_protocol .Values.serverName }}
      enableCors: true
      syncParticipantsIntervalMin: 2
      {{- if .Values.authorizer -}}
      {{ .Values.authorizer | toYaml | nindent 6 }}
      {{- end }}

    auth:
      # Management Portal URL
      managementPortalUrl: {{ .Values.managementportal_url }}
      # OAuth2 Auth URL for MP Client
      authUrl: {{ .Values.auth_url }}
      # OAuth2 Client id of rest sources authorizer backend
      clientId: radar_rest_sources_auth_backend
      # OAuth2 Client Secret of rest sources authorizer backend client
      clientSecret: {{ .Values.client_secret }}
      # List of public key endpoints for token verification
      jwksUrls:
        {{- if .Values.public_key_endpoints }}
        {{- range .Values.public_key_endpoints }}
        - {{ . | quote }}
        {{- end }}
        {{- else }}
        []
        {{- end }}

    database:
      driver: org.postgresql.Driver
      dialect: org.hibernate.dialect.PostgreSQLDialect

    restSourceClients:
    {{- if $restSourceClients }}
      {{- $restSourceClients | nindent 6 }}
    {{- else }} []
    {{- end }}

    {{- if .Values.redis.uri }}
    redis:
        uri: {{ .Values.redis.uri }}
    {{- end }}
{{- if .Values.googleHealth.enabled }}
  # Google service-account JSON, mounted at {{ .Values.googleHealth.serviceAccount.path }}.
  # Testing convenience: fill it in with `kubectl edit cm {{ include "radar-rest-sources-backend.fullname" . }}`
  # and then `kubectl rollout restart deployment/{{ include "radar-rest-sources-backend.fullname" . }}` —
  # subPath mounts do not pick up ConfigMap updates in place. Move this to a Secret before any real
  # deployment.
  ghaServiceAccountKey: |
{{ .Values.googleHealth.serviceAccount.key | default "{}" | indent 4 }}
{{- end }}
