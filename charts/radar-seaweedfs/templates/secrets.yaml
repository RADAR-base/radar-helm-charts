apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}-s3-config
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
data:
  s3_config.json: {{ include "radar-seaweedfs.s3Config" . | b64enc | quote }}
{{- if .Values.admin.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}-admin
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
data:
  adminUser: {{ required "admin.credentials.user is required" .Values.admin.credentials.user | b64enc | quote }}
  adminPassword: {{ required "admin.credentials.password is required when the admin UI is enabled" .Values.admin.credentials.password | b64enc | quote }}
{{- end }}
